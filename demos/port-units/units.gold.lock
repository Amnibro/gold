import math;
fn nf(v real, d int = -1) byte[>..] {
	var out byte[>..] = [];
	if !is_finite(v) { out.append("—"); return out; }
	var dd = d;
	if d == -1 {
		let a = abs(v);
		dd = if a >= 1000.0 { 0 } else if a >= 100.0 { 1 } else if a >= 10.0 { 2 } else if a >= 1.0 { 3 } else if a >= 0.01 { 4 } else { 5 };
	}
	var s byte[>..] = [];
	format_flt(s, v, dd, true);
	var nz = false;
	for c in s { if c >= '1' && c <= '9' { nz = true; } }
	if !nz { out.append("0"); return out; }
	var n = s.len;
	var dot = false;
	for c in s { if c == '.' { dot = true; } }
	if dot {
		while s[n - 1] == '0' { n -= 1; }
		if s[n - 1] == '.' { n -= 1; }
	}
	var start = 0;
	if s[0] == '-' { out.push('-'); start = 1; }
	var end = start;
	while end < n && s[end] != '.' { end += 1; }
	for i in start..end {
		if i > start && (end - i) % 3 == 0 { out.push(','); }
		out.push(s[i]);
	}
	for i in end..n { out.push(s[i]); }
	out
}
