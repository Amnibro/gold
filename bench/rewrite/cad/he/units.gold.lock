fn conv(q const byte[:], v real, s const byte[:]) real {
	let u = unit_entry(q, s);
	v * u.factor + u.offset
}
fn back(q const byte[:], v real, s const byte[:]) real {
	let u = unit_entry(q, s);
	(v - u.offset) / u.factor
}
fn unit_of(q const byte[:], s const byte[:] = sys()) const byte[:] {
	let u = unit_entry(q, s);
	u.label
}
fn to_si(q const byte[:], v real) real {
	back(q, v, sys())
}
fn from_si(q const byte[:], v real) real {
	conv(q, v, sys())
}
