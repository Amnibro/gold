import math;
import tiles.js;
fn nf(v real, d int = -1) byte[>..] {
	if !is_finite(v) {
		var out byte[>..] = [];
		out.append("—");
		return out;
	}
	var dd = d;
	if dd == -1 {
		let a = fabs(v);
		dd = if a >= 1000.0 { 0 } else if a >= 100.0 { 1 } else if a >= 10.0 { 2 } else if a >= 1.0 { 3 } else if a >= 0.01 { 4 } else { 5 };
	}
	return js::fixed_locale(v, dd, true);
}
