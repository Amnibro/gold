fn one(q const byte[:], v real, s const byte[:] = sys(), d int = -1) byte[>..] {
	var out = nf(conv(q, v, s), d);
	out.append(" ");
	out.append(unit_of(q, s));
	return out;
}
fn dual(q const byte[:], v real, d int = -1) byte[>..] {
	let is_si = sys() == "si";
	let cur = if is_si { "si" } else { "us" };
	let other = if is_si { "us" } else { "si" };
	var out = one(q, v, cur, d);
	out.append(" (");
	out.append(one(q, v, other, d));
	out.push(')');
	return out;
}
