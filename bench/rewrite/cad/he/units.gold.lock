fn conv(q const byte[:], v real, s const byte[:]) real {
	let l, f, o = unit_entry(q, s);
	v * f + o
}
fn back(q const byte[:], v real, s const byte[:]) real {
	let l, f, o = unit_entry(q, s);
	(v - o) / f
}
