import math;
fn nf(v real, d int = -1) byte[>..] {
	var out byte[>..] = [];
	if !is_finite(v) {
		out.append("—");
		return out;
	}
	var dd = d;
	if dd < 0 {
		let a = abs(v);
		dd = if a >= 1000.0 { 0 } else if a >= 100.0 { 1 } else if a >= 10.0 { 2 } else if a >= 1.0 { 3 } else if a >= 0.01 { 4 } else { 5 };
	}
	var t byte[>..] = [];
	format_flt(t, v, dd, true);
	var dot = -1;
	for i in t.len { if t[i] == '.' { dot = i; } }
	var end = t.len;
	if dot >= 0 {
		while end > dot + 1 && t[end - 1] == '0' { end -= 1; }
		if end == dot + 1 { end = dot; }
	}
	var start = 0;
	var neg = false;
	if t[0] == '-' {
		neg = true;
		start = 1;
	}
	let ie = if dot >= 0 { dot } else { t.len };
	var zero = true;
	for i in start..end {
		if t[i] != '0' && t[i] != '.' { zero = false; }
	}
	if neg && !zero { out.push('-'); }
	for i in start..ie {
		if i > start && (ie - i) % 3 == 0 { out.push(','); }
		out.push(t[i]);
	}
	if end > ie { out.append(t[ie..end]); }
	return out;
}
