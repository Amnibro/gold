	if q == "vol" { return mk_unit(si, "cm³", 1e-3, "in³", 1.0 / 16387.064); }
	if q == "mass" { return mk_unit(si, "kg", 1.0, "lb", 2.2046226); }
	if q == "force" { return mk_unit(si, "N", 1.0, "lbf", 0.22480894); }
