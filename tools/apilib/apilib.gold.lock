	if !ask(model, str(data, "/describe.txt"), p, tag, reply) { return 0; }
	let rl = split(reply, NL);
	var cnt = 0;
	let out_path = str(data, "/desc.", tag, ".tsv");
	for line in rl {
		let f = split(line, TAB);
		if f.len < 4 { continue; }
		let pos, ok = parse_int(trim(f[0]));
		if !ok || pos < 0 || pos >= ids.len { continue; }
		let topic = trim(f[f.len - 3]);
		let level = trim(f[f.len - 2]);
		let desc = trim(f[f.len - 1]);
		if topic.len == 0 || desc.len == 0 { continue; }
		if !(level == "pub" || level == "int") { continue; }
		let id = ids[pos];
		let decl = txt(SYMS[id].decl);
		var ln byte[>..] = [];
		ln.append(file);
		ln.push(TAB);
		ln.append(decl);
		ln.push(TAB);
		ln.append(topic);
		ln.push(TAB);
		ln.append(level);
		ln.push(TAB);
		ln.append(desc);
		ln.push(NL);
		append_file(out_path, ln);
		SYMS[id].topic = keep(topic);
		SYMS[id].level = keep(level);
		SYMS[id].desc = keep(desc);
		var known = false;
		for t in topics {
			if txt(t) == topic { known = true; }
		}
		if !known { topics.push(keep(topic)); }
		cnt++;
	}
	return cnt;
}
