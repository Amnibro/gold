recursive fn inline_md(out byte[>..]&, s const byte[:]) {
	var i = 0;
	while i < s.len {
		let c = s[i];
		if c == '`' {
			let k = find(s[i + 1..], "`");
			if k >= 0 {
				out.append("<code>");
				esc(out, s[i + 1..i + 1 + k]);
				out.append("</code>");
				i += k + 2;
				continue;
			}
		} else if c == '*' && i + 1 < s.len && s[i + 1] == '*' {
			let k = find(s[i + 2..], "**");
			if k >= 0 {
				out.append("<strong>");
				inline_md(out, s[i + 2..i + 2 + k]);
				out.append("</strong>");
				i += k + 4;
				continue;
			}
		} else if c == '[' {
			let k = find(s[i + 1..], "](");
			if k >= 0 {
				let j = i + 1 + k;
				let e = find(s[j + 2..], ")");
				if e >= 0 {
					let url = s[j + 2..j + 2 + e];
					out.append("<a href=\"");
					esc(out, url);
					if starts_with(url, "https://") {
						out.append("\" target=\"_blank\" rel=\"noopener noreferrer\">");
					} else {
						out.append("\">");
					}
					inline_md(out, s[i + 1..j]);
					out.append("</a>");
					i = j + 2 + e + 1;
					continue;
				}
			}
		}
		esc(out, s[i..i + 1]);
		i++;
	}
}
