fn slug(out byte[>..]&, s const byte[:]) {
	var pend = false;
	var started = false;
	for c in s {
		var d = c;
		if c >= 'A' && c <= 'Z' { d = c + 32; }
		if (d >= 'a' && d <= 'z') || (d >= '0' && d <= '9') {
			if pend && started { out.push('-'); }
			pend = false;
			started = true;
			out.push(d);
		} else {
			pend = true;
		}
	}
}
