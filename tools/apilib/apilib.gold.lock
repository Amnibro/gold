	for t, ti in topics {
		if ti > 0 { p.append(", "); }
		p.append(txt(t));
	}
	format(p, "\nAim for about ", want_topics, " topics for the whole module.\nDeclarations:\n");
	for k in ids.len {
		format(p, k, "\t", txt(SYMS[ids[k]].decl), "\n");
	}
	p.append("Source:\n");
	var src byte[>..] = [];
	if read_file(str(lib, "/", file), src) {
		let lines = split(src, NL);
		let n = lines.len;
		for i in min(30, n) {
			p.append(lines[i]);
			p.push(NL);
		}
		p.append("...\n");
		let lo = max(first.line - 3, 1);
		let hi = min(SYMS[ids[ids.len - 1]].line + 25, n);
		for i in (lo - 1)..hi {
			p.append(lines[i]);
			p.push(NL);
		}
	}
