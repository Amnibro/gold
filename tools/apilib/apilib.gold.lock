fn strip_links(out byte[>..]&, html const byte[:]) {
	var i = 0;
	while i < html.len {
		if starts_with(html[i..], "<a ") {
			let k = idx(html, i, '>');
			if k > 0 {
				i = k + 1;
				continue;
			}
		}
		if starts_with(html[i..], "</a>") {
			i += 4;
			continue;
		}
		out.push(html[i]);
		i++;
	}
}
