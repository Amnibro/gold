fn flat_links(out byte[>..]&, s const byte[:]) {
	var i = 0;
	while i < s.len {
		if s[i] == '`' {
			let k = find(s[i + 1..], "`");
			if k >= 0 {
				out.append(s[i..i + k + 2]);
				i += k + 2;
				continue;
			}
		} else if s[i] == '[' {
			let k = find(s[i + 1..], "](");
			if k >= 0 {
				let j = i + 1 + k;
				let e = find(s[j + 2..], ")");
				if e >= 0 {
					out.append(s[i + 1..j]);
					i = j + 2 + e + 1;
					continue;
				}
			}
		}
		out.push(s[i]);
		i++;
	}
}
