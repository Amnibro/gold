		let file = txt(f);
		var has = false;
		for &m in MODS {
			if txt(m.file) == file { has = true; }
		}
		if has { continue; }
		var p byte[>..] = [];
		p.append("Categories:\n");
		for &c in CATS {
			format(p, txt(c.slug), ": ", txt(c.title), "\n");
		}
		format(p, "File: ", file, "\nFirst 70 lines:\n");
		var src byte[>..] = [];
		if read_file(str(lib, "/", file), src) {
			let lines = split(src, NL);
			for i in min(70, lines.len) {
				p.append(lines[i]);
				p.push(NL);
			}
		}
		var reply byte[>..] = [];
		if !ask(model, str(data, "/module.txt"), p, "mod", reply) { continue; }
		let rl = split(reply, NL);
		if rl.len == 0 { continue; }
		let fl = split(rl[0], TAB);
		let cat = trim(fl[0]);
		var summary = "";
		if fl.len > 1 { summary = trim(fl[1]); }
		var known = false;
		for &c in CATS {
			if txt(c.slug) == cat { known = true; }
		}
		var cs = Str { 0, 0 };
		if known {
			cs = keep(cat);
		} else {
			var fallback = "logic";
			let top = top_of(file);
			for &m in MODS {
				if top_of(txt(m.file)) == top {
					fallback = txt(m.cat);
					break;
				}
			}
			cs = keep(fallback);
		}
		var nm byte[>..] = [];
		mod_name(nm, file);
		var sm byte[>..] = [];
		if summary.len == 0 {
			format(sm, "The ", nm, " library module.");
		} else {
			sm.append(summary);
		}
		MODS.push(Mod { file: f, cat: cs, blurb: keep(sm), dev: false });
		var line byte[>..] = [];
		line.append(file);
		line.push(TAB);
		line.append(txt(cs));
		line.push(TAB);
		line.append(sm);
		line.push(NL);
		append_file(str(data, "/modules.tsv"), line);
	}
	var w = 0;
	for r in MODS.len {
		let f = txt(MODS[r].file);
		var anys = false;
		for &s in SYMS {
			if txt(s.file) == f {
				anys = true;
				break;
			}
		}
		if anys {
			if w != r {
				let t = MODS[r];
				MODS[w] = t;
			}
			w++;
		}
	}
	if w < MODS.len { MODS.pop_n(MODS.len - w); }
	MODCNT_S = -1;
}
