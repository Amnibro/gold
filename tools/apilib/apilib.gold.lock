import os;
fn jstr(out byte[>..]&, s const byte[:]) {
	let hx = "0123456789abcdef";
	out.push('"');
	for c in s {
		if c == '"' {
			out.append("\\\"");
		} else if c == '\\' {
			out.append("\\\\");
		} else if c == '\n' {
			out.append("\\n");
		} else if c == '\r' {
			out.append("\\r");
		} else if c == '\t' {
			out.append("\\t");
		} else if c < 32 {
			out.append("\\u00");
			out.push(hx[c / 16]);
			out.push(hx[c % 16]);
		} else {
			out.push(c);
		}
	}
	out.push('"');
}
