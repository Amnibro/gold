fn esc(out byte[>..]&, s const byte[:]) {
	for c in s {
		if c == '&' {
			out.append("&amp;");
		} else if c == '<' {
			out.append("&lt;");
		} else if c == '>' {
			out.append("&gt;");
		} else if c == '"' {
			out.append("&quot;");
		} else {
			out.push(c);
		}
	}
