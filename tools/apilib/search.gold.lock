fn parse_index() {
	ROWS.clear();
	let n = IDX.len;
	var pos = 0;
	while pos < n {
		var e = pos;
		while e < n && IDX[e] != '\n' { e++; }
		var le = e;
		if le > pos && IDX[le - 1] == '\r' { le--; }
		var r = Row { at: [0; 6], len: [0; 6], pub_rank: false };
		var c = 0;
		var s = pos;
		var i = pos;
		while i <= le {
			if i == le || IDX[i] == '\t' {
				if c < 6 {
					r.at[c] = s;
					r.len[c] = i - s;
				}
				c++;
				s = i + 1;
			}
			i++;
		}
		if c == 6 {
			r.pub_rank = IDX[r.at[5]..r.at[5] + r.len[5]] == "pub";
			ROWS.push(r);
		}
		pos = e + 1;
	}
}
