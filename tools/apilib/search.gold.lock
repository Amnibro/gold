fn main() {
	Q = web::el("lib-q");
	RES = web::el("lib-results");
	if Q == 0 || RES == 0 { return; }
	web::listen(Q, "input", TAG_INPUT, 0);
	web::listen(Q, "focus", TAG_FOCUS, 0);
	web::listen(Q, "keydown", TAG_KEY, 0);
	web::listen(web::DOCUMENT, "keydown", TAG_DOCKEY, 0);
	web::listen(web::DOCUMENT, "click", TAG_CLICK, 0);
	var tmp byte[>..] = [];
	web::get_prop(Q, "value", tmp);
	let t = trim(tmp);
	if t.len > 0 {
		QUERY.clear();
		for c in t { QUERY.push(lc(c)); }
		load_index();
		render();
	}
}
