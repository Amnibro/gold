fn lc(c byte) byte { if c >= 'A' && c <= 'Z' { c + 32 } else { c } }
fn lower_has(hay const byte[:], needle const byte[:]) int {
	let n = needle.len;
	if n == 0 { return 0; }
	var i = 0;
	while i + n <= hay.len {
		var j = 0;
		while j < n && lc(hay[i + j]) == lc(needle[j]) { j++; }
		if j == n { return i; }
		i++;
	}
	return -1;
}
fn lower_eq(a const byte[:], b const byte[:]) bool {
	if a.len != b.len { return false; }
	for i in a.len {
		if lc(a[i]) != lc(b[i]) { return false; }
	}
	return true;
}
