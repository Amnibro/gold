export fn he_event(tag i32, kind i32) {
	if tag == TAG_FOCUS {
		load_index();
		if QUERY.len > 0 { render(); }
	} else if tag == TAG_INPUT {
		var tmp byte[>..] = [];
		web::ev_value(tmp);
		let t = trim(tmp);
		QUERY.clear();
		for c in t { QUERY.push(lc(c)); }
		load_index();
		render();
	} else if tag == TAG_INDEX {
		if kind == web::EV_FETCH {
			web::fetch_take(web::ev_id(), IDX);
			parse_index();
			LOADED = true;
			render();
		}
	} else if tag == TAG_KEY {
		var k byte[>..] = [];
		web::ev_key(k);
		if k == "ArrowDown" {
			web::ev_prevent();
			move_sel(1);
		} else if k == "ArrowUp" {
			web::ev_prevent();
			move_sel(-1);
		} else if k == "Enter" {
			web::ev_prevent();
			if SEL >= 0 {
				web::navigate(col(ROWS[SHOWN[SEL]], 3));
				web::attr(RES, "hidden", "");
			}
		} else if k == "Escape" {
			web::attr(RES, "hidden", "");
			web::call(Q, "blur");
		}
	} else if tag == TAG_DOCKEY {
		var k byte[>..] = [];
		web::ev_key(k);
		if k == "/" {
			let t = web::ev_target();
			var tn byte[>..] = [];
			web::get_prop(t, "tagName", tn);
			if tn != "INPUT" && tn != "TEXTAREA" {
				web::ev_prevent();
				web::call(Q, "focus");
			}
			web::release(t);
		}
	} else if tag == TAG_CLICK {
		let t = web::ev_target();
		let c = web::closest(t, ".lib-search");
		if c == 0 { web::attr(RES, "hidden", ""); }
		if c != 0 { web::release(c); }
		if t != 0 { web::release(t); }
	}
}
