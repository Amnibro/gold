fn move_sel(by int) {
	let n = SHOWN.len;
	if n == 0 { return; }
	let old = SEL;
	var nw = 0;
	if old < 0 {
		if by > 0 { nw = 0; } else { nw = n - 1; }
	} else {
		nw = (old + by) % n;
	}
	if old >= 0 {
		let c = web::child(RES, old as i32);
		web::cls(c, "sel", false);
		web::release(c);
	}
	let c2 = web::child(RES, nw as i32);
	web::cls(c2, "sel", true);
	web::scroll_into(c2, false, false);
	web::release(c2);
	SEL = nw;
}
