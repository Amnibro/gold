fn score(r Row, q const byte[:]) int {
	let name = col(r, 0);
	let module = col(r, 2);
	let desc = col(r, 4);
	var ss = 0;
	var k = 0;
	while k + 1 < name.len {
		if name[k] == ':' && name[k + 1] == ':' { ss = k + 2; k += 2; } else { k++; }
	}
	let short = name[ss..name.len];
	var s = 0;
	if lower_eq(name, q) || lower_eq(short, q) {
		s = 1000;
	} else if lower_has(short, q) == 0 {
		s = 800;
	} else if lower_has(name, q) == 0 {
		s = 750;
	} else {
		let p = lower_has(name, q);
		if p > 0 {
			s = 600;
			if name[p - 1] == '_' { s += 50; }
		} else {
			var ok = true;
			var seen = false;
			var in_name = 0;
			var in_mod = 0;
			var i = 0;
			while i < q.len {
				while i < q.len && q[i] == ' ' { i++; }
				if i >= q.len { break; }
				var e = i;
				while e < q.len && q[e] != ' ' { e++; }
				let w = q[i..e];
				seen = true;
				let a = lower_has(name, w) >= 0;
				let m = lower_has(module, w) >= 0;
				let d = lower_has(desc, w) >= 0;
				if !(a || m || d) { ok = false; break; }
				if a { in_name++; }
				if m { in_mod++; }
				i = e;
			}
			if ok && seen {
				s = 200 + 40 * in_name + 20 * in_mod;
				s += max(30 - name.len, 0);
			}
		}
	}
	if s > 0 {
		if r.pub_rank { s += 100; }
		if col(r, 1) == "guide" { s += 60; }
	}
	return s;
}
